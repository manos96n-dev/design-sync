<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design Sync Registry</title>
    <meta
      name="description"
      content="Install the Design Sync Figma and code tracking toolkit through shadcn."
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        background: #0a0a0a;
        color: #fafafa;
      }
      main {
        width: min(42rem, calc(100% - 3rem));
      }
      h1 {
        margin-bottom: 0.5rem;
        font-size: clamp(2rem, 7vw, 4rem);
        letter-spacing: -0.04em;
      }
      p {
        color: #a3a3a3;
        line-height: 1.6;
      }
      pre {
        overflow-x: auto;
        padding: 1rem;
        border: 1px solid #262626;
        border-radius: 0.75rem;
        background: #171717;
        color: #e5e5e5;
      }
      a {
        color: #fafafa;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Design Sync</h1>
      <p>
        A framework-independent toolkit for tracking explicit Figma and code
        synchronization baselines.
      </p>
      <pre><code>npx shadcn@latest add https://registry.manosnits.com/r/design-sync.json</code></pre>
      <p>
        <a href="/r/design-sync.json">Registry item</a> ·
        <a href="/r/registry.json">Registry index</a> ·
        <a href="https://github.com/manos96n-dev/design-sync">Source</a>
      </p>
    </main>
  </body>
</html>
